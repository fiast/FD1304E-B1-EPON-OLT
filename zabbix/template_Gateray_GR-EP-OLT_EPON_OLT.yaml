          name: 'ONU discovery'
          type: DEPENDENT
          key: gas.onu.lld
          lifetime: 14d
          description: 'ONUs discovered from the MAC table (.1.3.6.1.4.1.34592.1.3.4.1.1.7.1.1)'
          item_prototypes:
            - uuid: 49422435566c4751a95806460c30b754
              name: 'ONU [PON {#PON}/{#ONU}] {#SNMPVALUE} Bias current'
              type: DEPENDENT
              key: 'gas.onu.bias[{#SNMPINDEX}]'
              value_type: FLOAT
              units: mA
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var id = "{#SNMPINDEX}".replace(/^#/, "");
                      var data = JSON.parse(value);
                      for (var i = 0; i < data.length; i++) {
                          if (data[i].idx === id) { return data[i].val; }
                      }
                      return "";
                - type: MATCHES_REGEX
                  parameters:
                    - '^-?[0-9]+(\.[0-9]+)?$'
                  error_handler: DISCARD_VALUE
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var v = parseFloat(value);
                      if (!isFinite(v) || v <= 0) { return ""; }
                      return v / 500;
                - type: IN_RANGE
                  parameters:
                    - '0'
                    - '100'
                  error_handler: DISCARD_VALUE
              master_item:
                key: gas.onu.bias
              tags:
