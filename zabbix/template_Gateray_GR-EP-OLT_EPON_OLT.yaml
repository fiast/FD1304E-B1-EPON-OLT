zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: bab6f0ecb8f84999807a1001a52791c6
      name: OLT
  templates:
    - uuid: d013344845df4979bade56a43166e145
      template: Gateray_GR-EP-OLT_EPON_OLT
      name: 'Gateray GR-EP-OLT EPON OLT'
      description: |
        Gateray GR-EP-OLT (EPON-1U8P / EPON-1U4P) - EPON OLT monitoring via SNMP.
        
        Data (enterprise OID .1.3.6.1.4.1.34592):
          * system: name/descr/uptime/location/contact, CPU load, chassis temperature, alarm string
          * interfaces (IF-MIB): admin/oper, speed, in/out octets, in/out traffic (bps), in/out errors,
            tags: interface=<name>, if_type=<GE|PON>
          * ONU LLD from the MAC table (.34592.1.3.4.1.1.7.1). Tables are indexed <PON>.<ONU>, so the
            LLD index/macros are {#SNMPINDEX}=<PON>_<ONU>, {#PON}, {#ONU}, {#SNMPVALUE}=MAC.
            Per ONU: description (.4, empty -> "<unnamed>"), state (.11, 2=Offline 3=Online),
            distance (.13, m), Rx power (.36), Tx power (.37), module voltage (.38),
            bias current (.39), temperature (.40).
          * totals: Total ONUs online / offline
        
        Value decoding (verified against `show olt <n> optical-online-onu` and the NMS ONU table):
          * Rx/Tx power: raw value is optical power in 0.1 uW  ->  dBm = 10*log10(raw/10000)
          * voltage: raw/10000 V | bias: raw/500 mA | temperature: raw/256 C
          * raw 0 / sentinel values are discarded (item becomes unsupported instead of a bogus value)
        
        Thresholds: {$GATERAY.ONU.RX.MIN}, {$GATERAY.ONU.TX.MIN}, {$GATERAY.ONU.TX.MAX},
        {$GATERAY.ONU.TEMP.MAX}.
        
      groups:
        - name: OLT
      items:
        - uuid: aace23dd2be64e80b051e71b6956c0e3
          name: 'Total ONUs offline'
          type: CALCULATED
          key: gas.epon.total.offline
          params: 'sum(last_foreach(//gas.onu.offline[*]))'
          description: 'Calculated: sum(last_foreach(//gas.onu.offline[*]))'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
        - uuid: ec3800541e414191a3615824e9150cfc
          name: 'Total ONUs online'
          type: CALCULATED
          key: gas.epon.total.online
          params: 'sum(last_foreach(//gas.onu.online[*]))'
          description: 'Calculated: sum(last_foreach(//gas.onu.online[*]))'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
        - uuid: 99416a265b8f413ebb8df5841881cb3a
          name: 'ONU bias raw (walk)'
          type: SNMP_AGENT
          snmp_oid: 'walk[.1.3.6.1.4.1.34592.1.3.4.1.1.39.1]'
          key: gas.onu.bias
          delay: 5m
          value_type: TEXT
          description: 'SNMP walk .1.3.6.1.4.1.34592.1.3.4.1.1.39.1; JSON [{idx,val}] keyed as <PON>_<ONU> for LLD recursion.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var base = ".1.3.6.1.4.1.34592.1.3.4.1.1.39.1";
                  var lines = value.split("\n");
                  var out = [];
                  for (var i = 0; i < lines.length; i++) {
                      var line = lines[i];
                      var eq = line.indexOf(" = ");
                      if (eq < 1) { continue; }
                      var oid = line.substring(0, eq);
                      var rest = line.substring(eq + 3);
                      var c = rest.indexOf(": ");
                      var v = (c < 0) ? rest : rest.substring(c + 2);
                      var isHex = (rest.indexOf("Hex-STRING") === 0);
                      if (v.length > 1 && v.charAt(0) === '"' && v.charAt(v.length - 1) === '"') { v = v.substring(1, v.length - 1); }
                      var p = oid.substring(base.length + 1).split(".");
                      if (p.length < 2) { continue; }
                      var pon = p[p.length - 2];
                      var onu = p[p.length - 1];
                      var idx = pon + "_" + onu;
                      out.push({idx: idx, val: v});
                  }
                  return JSON.stringify(out);
          tags:
            - tag: scope
              value: onu
