        - uuid: d0cb3412338f4f01880e1fe5f812a7e1
          name: 'ONU MAC (walk)'
          type: SNMP_AGENT
          snmp_oid: 'walk[.1.3.6.1.4.1.34592.1.3.4.1.1.7.1]'
          key: gas.onu.mac
          delay: 2m
          value_type: TEXT
          description: 'SNMP walk .1.3.6.1.4.1.34592.1.3.4.1.1.7.1.1; JSON normalised for LLD recursion.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var base = ".1.3.6.1.4.1.34592.1.3.4.1.1.7.1";
                  var lines = value.split("\n");
                  var out = [];
                  for (var i = 0; i < lines.length; i++) {
                      var line = lines[i];
                      var eq = line.indexOf(" = ");
                      if (eq < 1) { continue; }
                      var oid = line.substring(0, eq);
                      var rest = line.substring(eq + 3);
                      var c = rest.indexOf(": ");
                      var v = (c < 0) ? rest : rest.substring(c + 2);
                      var isHex = (rest.indexOf("Hex-STRING") === 0);
                      if (v.length > 1 && v.charAt(0) === '"' && v.charAt(v.length - 1) === '"') { v = v.substring(1, v.length - 1); }
                      var p = oid.substring(base.length + 1).split(".");
                      if (p.length < 2) { continue; }
                      var pon = p[p.length - 2];
                      var onu = p[p.length - 1];
                      var idx = pon + "_" + onu;
                      if (v.indexOf(" ") >= 0) {
                          var mac = v.replace(/[^0-9A-Fa-f]/g, "");
                          if (mac.length === 12) {
                              v = "";
                              for (var j = 0; j < 12; j += 2) { v += (j ? ":" : "") + mac.substr(j, 2).toUpperCase(); }
                          }
                      }
                      var o = {}; o["{" + "#SNMPINDEX}"] = idx; o["{" + "#SNMPVALUE}"] = v;
                      o["{" + "#PON}"] = pon; o["{" + "#ONU}"] = onu;
                      out.push(o);
                  }
                  return JSON.stringify(out);
          tags:
            - tag: scope
              value: onu
        - uuid: 23749ea7093641c3ad28e430e34aacf0
          name: 'ONU name (walk, hex)'
          type: SNMP_AGENT
          snmp_oid: 'walk[.1.3.6.1.4.1.34592.1.3.4.1.1.4.1]'
          key: gas.onu.name
          delay: 5m
          value_type: TEXT
          description: 'SNMP walk .1.3.6.1.4.1.34592.1.3.4.1.1.3.1.1; JSON normalised for LLD recursion.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var base = ".1.3.6.1.4.1.34592.1.3.4.1.1.4.1";
                  var lines = value.split("\n");
                  var out = [];
                  for (var i = 0; i < lines.length; i++) {
                      var line = lines[i];
                      var eq = line.indexOf(" = ");
                      if (eq < 1) { continue; }
                      var oid = line.substring(0, eq);
                      var rest = line.substring(eq + 3);
                      var c = rest.indexOf(": ");
                      var v = (c < 0) ? rest : rest.substring(c + 2);
                      var isHex = (rest.indexOf("Hex-STRING") === 0);
                      if (v.length > 1 && v.charAt(0) === '"' && v.charAt(v.length - 1) === '"') { v = v.substring(1, v.length - 1); }
                      var p = oid.substring(base.length + 1).split(".");
                      if (p.length < 2) { continue; }
                      var pon = p[p.length - 2];
                      var onu = p[p.length - 1];
                      var idx = pon + "_" + onu;
                      if (isHex) {
                          var h = v.replace(/[^0-9A-Fa-f]/g, "");
                          var s = "";
                          for (var j = 0; j + 1 < h.length; j += 2) {
                              var code = parseInt(h.substr(j, 2), 16);
                              if (code === 0) { break; }
                              s += String.fromCharCode(code);
                          }
                          v = s;
                      }
                      if (v === "") { v = "<unnamed>"; }
                      out.push({idx: idx, val: v});
                  }
                  return JSON.stringify(out);
          tags:
            - tag: scope
              value: onu
