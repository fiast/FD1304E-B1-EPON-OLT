zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: bab6f0ecb8f84999807a1001a52791c6
      name: OLT
  templates:
    - uuid: ed5d332cdf12463499f1d0a1e14e9459
      template: BDCOM_P3310B_EPON_OLT
      name: 'BDCOM P3310B EPON OLT'
      description: |
        BDCOM P3310B EPON OLT (firmware 10.1.0B) - SNMP monitoring.
        
        This firmware does not expose the EPON ONU MIB (ONU names / optical power) via SNMP, so
        monitoring covers:
          * system: name/descr/uptime/location/contact
          * interfaces (IF-MIB): uplinks, PON ports (EPON0/x) and ONU logical interfaces (EPON0/x:y) -
            admin/oper status (subscriber online/offline), speed, in/out octets,
            in/out traffic (bps), in/out errors; tags: interface=<name>, if_type=<EPON|GigaEthernet>
        ONU optical parameters (Rx/Tx) are NOT available via SNMP on this model/firmware.
        
      groups:
        - name: OLT
      items:
        - uuid: c9cb4ed6bd644f1c87a677d9efdb3cbe
          name: 'Interface admin status (walk)'
          type: SNMP_AGENT
          snmp_oid: 'walk[.1.3.6.1.2.1.2.2.1.7]'
          key: if.admin
          delay: 2m
          value_type: TEXT
          description: 'SNMP walk .1.3.6.1.2.1.2.2.1.7; JSON normalised for LLD recursion.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var base = ".1.3.6.1.2.1.2.2.1.7";
                  var lines = value.split("\n");
                  var out = [];
                  for (var i = 0; i < lines.length; i++) {
                      var line = lines[i];
                      var eq = line.indexOf(" = ");
                      if (eq < 1) { continue; }
                      var oid = line.substring(0, eq);
                      var rest = line.substring(eq + 3);
                      var c = rest.indexOf(": ");
                      var v = (c < 0) ? rest : rest.substring(c + 2);
                      if (v.length > 1 && v.charAt(0) === '"' && v.charAt(v.length - 1) === '"') { v = v.substring(1, v.length - 1); }
                      var idx = oid.substring(base.length + 1);
                      var d = idx.indexOf(".");
                      if (d > 0) { idx = idx.substring(0, d); }
                      out.push({idx: idx, val: v});
                  }
                  return JSON.stringify(out);
          tags:
            - tag: scope
              value: iface
        - uuid: a1246b7df1974443b2e966ca90d5ef42
          name: 'Interface input errors (walk)'
          type: SNMP_AGENT
          snmp_oid: 'walk[.1.3.6.1.2.1.2.2.1.14]'
