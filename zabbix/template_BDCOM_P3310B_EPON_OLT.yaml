        - uuid: 3fb84c722ede4b5483631fcac47b4ff9
          name: 'Interface names (walk)'
          type: SNMP_AGENT
          snmp_oid: 'walk[.1.3.6.1.2.1.2.2.1.2]'
          key: if.name
          delay: 2m
          value_type: TEXT
          description: 'SNMP walk .1.3.6.1.2.1.2.2.1.2; JSON normalised for LLD (adds {#IF_TYPE}).'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var base = ".1.3.6.1.2.1.2.2.1.2";
                  var lines = value.split("\n");
                  var out = [];
                  for (var i = 0; i < lines.length; i++) {
                      var line = lines[i];
                      var eq = line.indexOf(" = ");
                      if (eq < 1) { continue; }
                      var oid = line.substring(0, eq);
                      var rest = line.substring(eq + 3);
                      var c = rest.indexOf(": ");
                      var v = (c < 0) ? rest : rest.substring(c + 2);
                      if (v.length > 1 && v.charAt(0) === '"' && v.charAt(v.length - 1) === '"') { v = v.substring(1, v.length - 1); }
                      var idx = oid.substring(base.length + 1);
                      var d = idx.indexOf(".");
                      if (d > 0) { idx = idx.substring(0, d); }
                      var o = {}; o["{" + "#SNMPINDEX}"] = idx; o["{" + "#SNMPVALUE}"] = v;
                      var t = v.replace(/^.*[\s,]/, "").replace(/[0-9].*$/, "").replace(/[-:]+$/, "");
                      o["{" + "#IF_TYPE}"] = t ? t : v;
                      out.push(o);
                  }
                  return JSON.stringify(out);
          tags:
            - tag: scope
              value: iface
