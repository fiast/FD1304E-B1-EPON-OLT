              key: 'if.speed[{#SNMPINDEX}]'
              units: bps
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var id = "{#SNMPINDEX}".replace(/^#/, "");
                      var data = JSON.parse(value);
                      for (var i = 0; i < data.length; i++) {
                          if (data[i].idx === id) { return data[i].val; }
