              type: DEPENDENT
              key: 'if.admin[{#SNMPINDEX}]'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var id = "{#SNMPINDEX}".replace(/^#/, "");
                      var data = JSON.parse(value);
                      for (var i = 0; i < data.length; i++) {
                          if (data[i].idx === id) { return data[i].val; }
                      }
                      return "";
                - type: MATCHES_REGEX
                  parameters:
                    - '^-?[0-9]+$'
                  error_handler: DISCARD_VALUE
              master_item:
