zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: e76ae8c1c5cb4865ac8cecb1975c2129
      name: CDATA
  templates:
    - uuid: e98d2c0cd54744f4b1e4514c760f7c24
      template: C-Data_FD1304E-B1_EPON_OLT
      name: 'C-Data FD1304E-B1 EPON OLT'
      description: |
        C-Data FD1304E-B1 - EPON OLT monitoring via SNMP (BDCOM/C-Data enterprise OID .1.3.6.1.4.1.17409).
        
        LLD (low-level discovery) over SNMP walk:
          * ONU discovery  - subscriber name/state (online/offline), optical parameters:
                             Rx/Tx power (dBm), voltage (V), temperature (C), bias current (mA), uptime
                             + online/offline flag items used for per-port aggregation
          * EPON port LLD  - per-EPON-port ONU summary: "ONUs online" / "ONUs offline"
                             (calculated: sum(last_foreach(//cdata.onu.online[*]?[tag="onu_port:<port>"])))
          * Interface LLD  - admin/oper status, speed, in/out octets, in/out traffic (bps), in/out errors
        
        Implementation notes:
          * Master items use SNMP OID "walk[<oid>]" + JavaScript preprocessing that converts
            the raw walk text into a JSON array [{idx,val}] used by dependent LLD/item prototypes.
          * Zabbix 7.4.5 substitutes the LLD macro {#SNMPINDEX} inside preprocessing parameters
            as '#<value>' (stray '#'), so per-ONU/port extraction is done in JavaScript
            (see the "JavaScript" preprocessing step of the item prototypes).
        
        Requires host macros: {$SNMP_COMMUNITY}.
        Tuning macros: {$CDATA.ONU.RX_MIN} (-26), {$CDATA.ONU.RX_OK} (-24), {$CDATA.ONU.TEMP_MAX} (60),
                       {$CDATA.IF.ERRORS_WARN} (1).
        
        Tags (use them to look at one subscriber/interface only):
          * ONU items/triggers:      scope=onu, component=olt, subscriber=<ONU name>, onu_id=<ONU id>,
                                     onu_port=<EPON port, e.g. "epon 0/1/1">
          * Interface items/triggers: scope=port, component=olt, interface=<ifName>, ifindex=<ifIndex>
          * EPON port summary items:  scope=port, component=olt, interface=<ifName>, ifindex=<ifIndex>
          In Monitoring -> Latest data / Problems click a tag value to filter by this subscriber.
        
        Graph prototypes (for the built-in "Graph prototype" dashboard widget):
          * ONU [{#SNMPVALUE}] optical signal  - Rx/Tx (dBm)
          * Interface [{#SNMPVALUE}] traffic   - in/out bps
          * Interface [{#SNMPVALUE}] errors    - in/out error packets
        
        Dashboards are created by create_dashboards.py:
          * "OLT <host> - Абонент (метрики одного абонента)"
          * "OLT <host> - Абонентские интерфейсы (EPON)"
          * "OLT <host> - Подключения ONU (абоненты)" - honeycomb availability + Rx heat map,
            ONU table, problems and per-ONU signal graphs
          * "OLT <host> - Сводка по EPON-портам (ONU online/offline)" - per-port ONU counters
        Per-ONU dashboards (one dashboard per subscriber, titled with the ONU name) are created by
        sync_onu_dashboards.py - Zabbix has no dashboard prototypes, so this script plays that role
        (run it from cron after discovery).
        
        Note: the "[<if>] port is down" trigger fires for every interface with ifAdminStatus=up and
        ifOperStatus=down, including spare (unconnected) ports. Disable it if it is too noisy.
        
      groups:
        - name: CDATA
      items:
        - uuid: b5fc52338dc64019875580966f475a1a
          name: 'Interface admin status (walk)'
          type: SNMP_AGENT
          snmp_oid: 'walk[.1.3.6.1.2.1.2.2.1.7]'
          key: cdata.if.admin
          delay: 2m
          value_type: TEXT
          description: 'SNMP walk .1.3.6.1.2.1.2.2.1.7; JSON normalised for LLD recursion.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var base = ".1.3.6.1.2.1.2.2.1.7";
                  var lines = value.split("\n");
                  var out = [];
                  for (var i = 0; i < lines.length; i++) {
                      var line = lines[i];
                      var eq = line.indexOf(" = ");
                      if (eq < 1) { continue; }
                      var oid = line.substring(0, eq);
                      var rest = line.substring(eq + 3);
                      var c = rest.indexOf(": ");
                      var v = (c < 0) ? rest : rest.substring(c + 2);
                      if (v.length > 1 && v.charAt(0) === '"' && v.charAt(v.length - 1) === '"') { v = v.substring(1, v.length - 1); }
                      var idx = oid.substring(base.length + 1);
                      var d = idx.indexOf('.');
                      if (d > 0) { idx = idx.substring(0, d); }
                      out.push({idx: idx, val: v});
                  }
                  return JSON.stringify(out);
