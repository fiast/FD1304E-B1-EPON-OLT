                      var oid = line.substring(0, eq);
                      var rest = line.substring(eq + 3);
                      var c = rest.indexOf(": ");
                      var v = (c < 0) ? rest : rest.substring(c + 2);
                      if (v.length > 1 && v.charAt(0) === '"' && v.charAt(v.length - 1) === '"') { v = v.substring(1, v.length - 1); }
                      var idx = oid.substring(base.length + 1);
                      var d = idx.indexOf('.');
                      if (d > 0) { idx = idx.substring(0, d); }
                      out.push({idx: idx, val: v});
                  }
                  return JSON.stringify(out);
        - uuid: 115fc8a8c83845448bdcc428dcd43453
          name: 'ONU voltage (walk)'
          type: SNMP_AGENT
          snmp_oid: 'walk[.1.3.6.1.4.1.17409.2.3.4.2.1.6]'
          key: cdata.onu.voltage
          delay: 2m
          value_type: TEXT
          description: 'SNMP walk .1.3.6.1.4.1.17409.2.3.4.2.1.6; JSON normalised for LLD recursion.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var base = ".1.3.6.1.4.1.17409.2.3.4.2.1.6";
                  var lines = value.split("\n");
                  var out = [];
                  for (var i = 0; i < lines.length; i++) {
                      var line = lines[i];
                      var eq = line.indexOf(" = ");
                      if (eq < 1) { continue; }
                      var oid = line.substring(0, eq);
                      var rest = line.substring(eq + 3);
                      var c = rest.indexOf(": ");
                      var v = (c < 0) ? rest : rest.substring(c + 2);
                      if (v.length > 1 && v.charAt(0) === '"' && v.charAt(v.length - 1) === '"') { v = v.substring(1, v.length - 1); }
                      var idx = oid.substring(base.length + 1);
                      var d = idx.indexOf('.');
                      if (d > 0) { idx = idx.substring(0, d); }
                      out.push({idx: idx, val: v});
                  }
                  return JSON.stringify(out);
